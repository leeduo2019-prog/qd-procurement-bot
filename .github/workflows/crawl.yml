name: Procurement Crawler

permissions:
  contents: read

on:
  schedule:
    # 每天北京时间 08:30 和 16:00 运行
    - cron: '30 0 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      KEYWORDS: ${{ secrets.KEYWORDS }}
      AREA_TYPE: ${{ secrets.AREA_TYPE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache notices.db
        uses: actions/cache@v4
        with:
          path: notices.db
          key: notices-db-${{ github.run_number }}
          restore-keys: notices-db-

      - name: Run Crawler
        run: |
          python main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-results-${{ github.run_number }}
          path: |
            notices.db
            *.json
            *.csv
          retention-days: 30
