name: Procurement Crawler

permissions:
  contents: read

# 调度已移除:目标站点 API (http://zfcg.qingdao.gov.cn:58060) 仅在中国境内可达,
# GitHub Actions 的 US runner 无法建立 TCP 连接。改用本地 cron 运行 main.py。
# 保留 workflow_dispatch 供手动触发(自托管中国 runner / 测试用)。
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      KEYWORDS: ${{ secrets.KEYWORDS }}
      AREA_TYPE: ${{ secrets.AREA_TYPE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache notices.db
        uses: actions/cache@v4
        with:
          path: notices.db
          key: notices-db-${{ github.run_number }}
          restore-keys: notices-db-

      - name: Run Crawler
        run: |
          python main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-results-${{ github.run_number }}
          path: |
            notices.db
            *.json
            *.csv
          retention-days: 30
